[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bactrainus"
version = "0.1.0"
description = "Modular evidence selection and answer generation for multi-hop question answering."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Iman Barati" },
  { name = "Arash Ghafouri" },
  { name = "Behrouz Minaei-Bidgoli" },
]
keywords = [
  "multi-hop question answering",
  "HotpotQA",
  "large language models",
  "evidence selection",
  "retrieval augmented generation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
data = [
  "datasets>=3,<5",
  "pyarrow>=17,<22",
]
inference = [
  "accelerate>=1,<2",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
]
api = ["openai>=1.50,<2"]
training = [
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "peft>=0.13,<1",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
  "trl>=0.12,<1",
]
analysis = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]
dev = [
  "build>=1.2,<2",
  "codespell>=2.4,<3",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/Iman998/bactrainus"
Documentation = "https://github.com/Iman998/bactrainus#readme"
Paper = "https://arxiv.org/abs/2501.06286"
Models = "https://huggingface.co/bactrianus"
Dataset = "https://huggingface.co/datasets/bactrianus/bactrainus-hotpotqa"
Issues = "https://github.com/Iman998/bactrainus/issues"

[project.scripts]
bactrainus = "bactrainus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=bactrainus --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bactrainus"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DTZ", "PTH", "RUF", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"examples/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["bactrainus"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "datasets.*",
  "openai.*",
  "peft.*",
  "transformers.*",
  "trl.*",
  "yaml",
]
ignore_missing_imports = true
