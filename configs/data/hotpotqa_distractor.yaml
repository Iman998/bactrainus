schema_version: 1
dataset:
  name: hotpotqa_distractor
  source: hotpotqa/hotpot_qa
  homepage: https://hotpotqa.github.io/
  language: en
  license: cc-by-sa-4.0
  source_id_field: source_id
splits:
  train:
    examples: 90447
    public_release: true
  validation:
    examples: 7405
    public_release: false
instance_contract:
  candidate_paragraphs:
    minimum: 2
    maximum: 10
    ten_paragraph_records: 89609
  sentence_indices: zero_based
  preserve_candidate_order: true
  preserve_sentence_order: true
public_dataset:
  repo_id: bactrianus/bactrainus-hotpotqa
  train_only: true
  configurations:
    - structured
    - reader-sft
    - cot-reader-sft
    - paragraph-selector-sft
    - question-decomposer-sft
    - sentence-selector-sft
    - decomposed-sentence-selector-sft
    - joint-selector-reader-sft
excluded_from_public_dataset:
  - validation_and_test_records
  - predictions
  - evaluation_results
  - api_payloads
