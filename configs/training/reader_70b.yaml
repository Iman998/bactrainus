schema_version: 1
experiment_id: reader_70b_direct
task: answer_generation
model: ../models/llama_3_1_70b_instruct.yaml
data:
  config: ../data/hotpotqa_distractor.yaml
  view: reader-sft
  evidence: gold_supporting_facts
  train_examples: 90447
  release_data_available: true
training:
  epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  max_sequence_length: 512
  learning_rate: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  lora:
    rank: 16
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
supervision:
  target: answer
  rationale: false
