schema_version: 1
experiment_id: reader_8b_direct
task: answer_generation
model: ../models/llama_3_1_8b_instruct.yaml
data:
  config: ../data/hotpotqa_distractor.yaml
  view: reader-sft
  evidence: gold_supporting_facts
  train_examples: 90447
  release_data_available: true
training:
  epochs: 2
  per_device_batch_size: 8
  gradient_accumulation_steps: 32
  effective_batch_size: 256
  max_sequence_length: 512
  learning_rate: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  lora:
    rank: 64
    alpha: 128
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - lm_head
supervision:
  target: answer
  rationale: false
