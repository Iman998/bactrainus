schema_version: 1
experiment_id: sentence_selector_8b
task: supporting_sentence_selection
model: ../models/llama_3_1_8b_instruct.yaml
data:
  config: ../data/hotpotqa_distractor.yaml
  view: sentence-selector-sft
  train_examples: 90447
  release_data_available: true
training:
  epochs: 2
  per_device_batch_size: 4
  gradient_accumulation_steps: 16
  effective_batch_size: 64
  max_sequence_length: 1024
  learning_rate: 2.0e-5
  scheduler: cosine
  warmup_ratio: 0.03
  lora:
    rank: 64
    alpha: 128
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - lm_head
supervision:
  target: supporting_fact_pairs
  sentence_indices: zero_based
